[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genai"
version = "0.1.0"
description = "MedBalance GenAI Service"
requires-python = ">=3.12"
dependencies = [
    "medbal-common",
    "anthropic>=0.30.0",
    "jinja2>=3.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["genai_service", "src"]

