[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast"
version = "0.1.0"
description = "MedBalance Forecast Service"
requires-python = ">=3.12"
dependencies = [
    "medbal-common",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

