[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingest-ai"
version = "0.1.0"
description = "MedBalance Ingest-AI Service"
requires-python = ">=3.12"
dependencies = [
    "medbal-common",
    "rapidfuzz>=3.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ingest_ai", "src"]
