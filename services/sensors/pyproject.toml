[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensors"
version = "0.1.0"
description = "MedBalance Temperature Sensors Simulation"
requires-python = ">=3.12"
dependencies = [
    "medbal-common",
    "paho-mqtt>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sensors", "src"]

