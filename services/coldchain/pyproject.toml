[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldchain"
version = "0.1.0"
description = "MedBalance ColdChain Service"
requires-python = ">=3.12"
dependencies = [
    "medbal-common",
    "paho-mqtt>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["coldchain", "src"]

