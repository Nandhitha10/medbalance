events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream core-api {
        server core-api:8001;
    }

    upstream ingest-ai {
        server ingest-ai:8002;
    }

    upstream genai {
        server genai:8003;
    }

    upstream forecast {
        server forecast:8004;
    }

    upstream optimizer {
        server optimizer:8005;
    }

    upstream coldchain {
        server coldchain:8006;
    }

    upstream sim-control {
        server sim-control:8100;
    }

    upstream web {
        server web:80;
    }

    server {
        listen 8080;
        server_name localhost;

        # SSE endpoint for core events
        location /api/core/events {
            proxy_pass http://core-api/events;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        # Core API
        location /api/core/ {
            proxy_pass http://core-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Optimizer
        location /api/optimizer/ {
            proxy_pass http://optimizer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Ingest AI
        location /api/ingest/ {
            proxy_pass http://ingest-ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # GenAI Gateway
        location /api/genai/ {
            proxy_pass http://genai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Forecast
        location /api/forecast/ {
            proxy_pass http://forecast/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ColdChain
        location /api/coldchain/ {
            proxy_pass http://coldchain/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Sim Control
        location /api/sim/ {
            proxy_pass http://sim-control/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend web dashboard
        location / {
            proxy_pass http://web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
