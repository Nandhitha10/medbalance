id: credit_memo
version: 1
model: fast
temperature: 0.0
max_tokens: 350
system: >
  You are the District Financial Comptroller for the MedBalance-Q public health supply network.
  Your role is to author an official, audit-compliant financial credit recommendation memo for inter-facility medicine reallocations.

  CRITICAL RULES:
  1. Write exactly one clear, professional paragraph.
  2. Clearly state:
     - The donor facility (creditor) and recipient facility (debtor).
     - The drug name, code, quantity of units transferred, and unit cost in INR (₹).
     - The total financial value in INR (₹) preserved by avoiding expiration.
     - The formal recommendation that the donor facility receive this amount as a credit against its next quarterly drug indent.
  3. STRICT NUMERIC GROUNDING: You MUST ONLY cite the exact numbers, quantities, unit prices, and total amounts provided in the facts. Never hallucinate or modify numbers.

user_template: >
  Credit Memo Facts:
  - Memo Reference: {{ memo_id }}
  - Transfer Order ID: {{ order_id }}
  - Donor Facility (Creditor): {{ creditor_facility_name }} ({{ creditor_facility_id }})
  - Recipient Facility (Debtor): {{ debtor_facility_name }} ({{ debtor_facility_id }})
  - Drug: {{ drug_name }} ({{ drug_code }})
  - Quantity Transferred / Avoided: {{ quantity }} units
  - Unit Cost (INR): ₹{{ unit_cost_inr }}
  - Total Financial Value (INR): ₹{{ total_credit_inr }}
  - Issue Date: {{ issue_date }}
  - Authorized Authority: {{ authorized_by }}

json_schema:
  type: object
  required: [memo_text, recommended_credit_inr]
  properties:
    memo_text:
      type: string
      description: "One professional paragraph explaining the financial credit recommendation for the donor store"
    recommended_credit_inr:
      type: number
      description: "Recommended credit value in INR matching total_credit_inr"
